<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Vortex Collections</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="portal.css"></head><body><header class="nav-wrap"><nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">V</span><span>VORTEX<span class="muted">ADMIN</span></span></a><a class="nav-login" href="index.html#cliente">Voltar ↗</a></nav></header><main class="portal"><span class="section-kicker">PAINEL PRIVADO</span><h1>Administração.</h1><p class="portal-note">O painel só aceita o administrador principal definido em ADMIN_USER_ID.</p><div id="overview" class="portal-grid"></div><div class="portal-grid"><form id="coupon" class="portal-card"><h2>Criar cupom</h2><label>Código<input name="code" required></label><label>Tipo<select name="discount_type"><option value="percent">Porcentagem</option><option value="fixed">Valor em centavos</option></select></label><label>Desconto<input name="discount_value" type="number" min="1" required></label><label>Limite de usos<input name="max_uses" type="number" min="1"></label><button class="btn btn-primary">Criar cupom</button></form><form id="agent" class="portal-card"><h2>Adicionar suporte</h2><p>O usuário precisa estar cadastrado.</p><label>E-mail<input name="email" type="email" required></label><button class="btn btn-primary">Adicionar à equipe</button></form><form id="grant" class="portal-card"><h2>Adicionar licença</h2><label>ID do cliente<input name="user_id" type="number" min="1" required></label><label>Produto<select name="product"><option value="vortex-kitpvp">VortexKitPvP</option><option value="vortex-feast">VortexFeast</option><option value="vortex-thepit">VortexThePIT</option><option value="vortex-skywars">VortexSkyWars</option></select></label><button class="btn btn-primary">Gerar licença</button></form><form id="password" class="portal-card"><h2>Alterar senha</h2><label>ID do cliente<input name="user_id" type="number" min="1" required></label><label>Nova senha<input name="new_password" type="password" minlength="8" required></label><button class="btn btn-primary">Salvar senha</button></form></div><section class="portal-card"><h2>Licenças</h2><div id="licenses" class="portal-list"></div></section><p class="portal-message"></p></main><script src="admin.js"></script><script src="admin-password.js"></script></body></html>
